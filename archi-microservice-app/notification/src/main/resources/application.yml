server:
  port: ${NOTIFICATION_SERVER_PORT:9092}

spring:
  application:
    name: notification
  datasource:
    url: ${NOTIFICATION_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        generate_statistics: false
        temp:
          use_jdbc_metadata_defaults: false
  zipkin:
    base-url: ${ZIPKIN_BASE_URL:http://localhost:9411}
  sleuth:
    sampler:
      probability: ${SLEUTH_SAMPLER_PROBABILITY:1.0}
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true

rabbitmq:
  exchanges:
    internal: ${RABBITMQ_INTERNAL_EXCHANGE:internal.exchange}
  queues:
    notification: ${RABBITMQ_NOTIFICATION_QUEUE:notification.queue}
  routing-keys:
    internal-notification: ${RABBITMQ_INTERNAL_NOTIFICATION_ROUTING_KEY:internal.notification.routing-key}
